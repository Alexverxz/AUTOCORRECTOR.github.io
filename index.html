<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autocorrector Predictivo Modular (Trie)</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Hoja de estilos externa -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">
        <div class="main-card p-4 shadow-sm">
            <h4 class="text-primary mb-2 fw-bold">Autocorrector Lógico de Oraciones</h4>
            <p class="text-muted small mb-4">Escribe una oración. Al teclear al menos las <strong>primeras 3
                    letras</strong> de la última palabra, el sistema consultará el diccionario JSON mediante una
                estructura de datos optimizada (Trie) para sugerirte opciones lógicas.</p>

            <div class="mb-3 position-relative">
                <label for="inputOracion" class="form-label fw-bold small text-secondary">Escribe tu oración:</label>

                <!-- Cuadro de texto con límite estricto de 50 caracteres -->
                <input type="text" id="inputOracion" class="form-control" maxlength="50"
                    placeholder="Ej: Para activar la racha tienes que man..." autocomplete="off">

                <div class="d-flex justify-content-between align-items-center mt-1">
                    <span id="contadorChars" class="form-text text-muted small">0 / 50 caracteres</span>
                    <span id="estadoPredictivo" class="badge bg-secondary">Cargando biblioteca...</span>
                </div>

                <!-- Lista flotante de sugerencias predictivas -->
                <div id="listaSugerencias" class="list-group sugerencias-box shadow-sm"></div>
            </div>

            <!-- Botón de revisión -->
            <button class="btn btn-primary w-100 mt-2" id="btnRevisar">Verificar Oración Completa</button>

            <!-- Área de retroalimentación -->
            <div id="resultadoBox" class="mt-3"></div>
        </div>
    </div>

    <!-- Script de JavaScript externo -->
    <script src="script.js"></script>
</body>

</html>
